<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">llm-roundtable</title>
  <desc id="d">Six AI models from five vendors sit around a round table and vote: Fable, Opus, GPT via Codex, Grok, Gemini via Antigravity, and a free OpenCode model.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3fb950" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="#0d1117"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="150" fill="#e6edf3" font-size="64" font-weight="700" letter-spacing="-1">llm-roundtable</text>
    <text x="74" y="204" fill="#9da7b3" font-size="26">A council of AI models decides while you are away.</text>
    <text x="74" y="244" fill="#9da7b3" font-size="26">Evidence, anonymous cross-exam, weighted vote.</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">
      <rect x="72" y="290" width="560" height="52" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="92" y="323" fill="#7d8590">$</text>
      <text x="114" y="323" fill="#e6edf3">VERDICT: B</text>
      <text x="262" y="323" fill="#3fb950">(council)</text>
      <text x="398" y="323" fill="#7d8590">5 of 6 seats</text>
    </g>
  </g>
  <g transform="translate(990 200)">
    <circle r="150" fill="url(#glow)"/>
    <circle r="78" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text y="8" text-anchor="middle" fill="#3fb950" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="700">VOTE</text>
    <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
      <g transform="translate(0 -128)"><circle r="30" fill="#d97757"/><text y="5" fill="#0d1117">Fable</text></g>
      <g transform="translate(111 -64)"><circle r="30" fill="#c96442"/><text y="5" fill="#0d1117">Opus</text></g>
      <g transform="translate(111 64)"><circle r="30" fill="#10a37f"/><text y="5" fill="#0d1117">GPT</text></g>
      <g transform="translate(0 128)"><circle r="30" fill="#d1d5db"/><text y="5" fill="#0d1117">Grok</text></g>
      <g transform="translate(-111 64)"><circle r="30" fill="#4f8cf7"/><text y="5" fill="#0d1117">Gemini</text></g>
      <g transform="translate(-111 -64)"><circle r="30" fill="#f5a524"/><text y="5" font-size="12" fill="#0d1117">OpenCode</text></g>
    </g>
  </g>
</svg>
