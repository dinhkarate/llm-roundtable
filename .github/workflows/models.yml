name: models

# Weekly refresh of model information from models.dev:
# - commits skills/llm-roundtable/scripts/opencode-models.json (free OpenCode models) and docs/model-watch.md
#   to main when they changed, after the test suite passes;
# - opens or updates an issue when a fixed seat has a newer model of its family. seats.json is never edited
#   here: a new model must pass a real CLI call (`roundtable.py doctor --probe`) first.

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: models
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Refresh from models.dev
        run: python tools/update_models.py
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Commit changes
        run: |
          if git diff --quiet; then echo "no model changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/llm-roundtable/scripts/opencode-models.json docs/model-watch.md
          git commit -m "models: refresh from models.dev" -m "$(grep '^| opencode' docs/model-watch.md || true)"
          git push origin HEAD:main
      - name: Issue for newer fixed-seat models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rows=$(grep '^| ' docs/model-watch.md | grep -v '^| opencode' | grep -v '| none |$' | grep -v '^| Seat\|^|---' || true)
          title="Newer models available for fixed seats"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -z "$rows" ]; then
            [ -n "$num" ] && gh issue close "$num" --comment "All fixed seats are on the newest model models.dev lists."
            exit 0
          fi
          body=$(printf '%s\n\n| Seat | Runs | Released | Newer on models.dev |\n|---|---|---|---|\n%s\n\n%s\n' \
            "models.dev lists newer models of the same family. Before bumping \`seats.json\` (primary + one fallback), check each with a real call: \`roundtable.py doctor --probe\`, then update the table in \`docs/research.md\`." \
            "$rows" "Generated by the [models workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).")
          if [ -n "$num" ]; then gh issue edit "$num" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
